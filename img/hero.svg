  <g>
    <ellipse cx="330" cy="285" rx="52" ry="14" fill="#c98500"/><rect x="278" y="268" width="104" height="17" fill="url(#g2)"/><ellipse cx="330" cy="268" rx="52" ry="14" fill="#ffd54a"/>
    <ellipse cx="330" cy="256" rx="52" ry="14" fill="#c98500"/><rect x="278" y="239" width="104" height="17" fill="url(#g2)"/><ellipse cx="330" cy="239" rx="52" ry="14" fill="#ffd54a"/>
    <ellipse cx="330" cy="236" rx="30" ry="8" fill="#f5b800"/>
